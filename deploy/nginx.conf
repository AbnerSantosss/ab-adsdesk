server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Sem backend nesta imagem: o front trata 404 como "serviço indisponível".
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 404 '{"error":"Serviço indisponível nesta versão."}';
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Navegação por hash (#campanhas...): tudo cai no index.html, que nunca fica em cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
