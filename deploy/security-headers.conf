# Incluído em cada location: um add_header dentro de location anula os do server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# graph.facebook.com: conexão com a Meta feita pelo navegador (modal Conectar conta).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://graph.facebook.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
