# Constrói a imagem no GitHub e publica no GHCR a cada push em main. A VPS
# (6,4 GB para ~40 containers) só puxa a imagem pronta: no Portainer, a stack
# usa o docker-compose.yml deste repositório e "Pull and redeploy" atualiza.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abnersantosss/ab-adsdesk:latest
            ghcr.io/abnersantosss/ab-adsdesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
